<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Poker Akademi - Sıfırdan Öğren & Maç At</title>
    <style>
        :root {
            --bg-dark: #0f172a;
            --card-bg: #1e293b;
            --table-felt: #0b6623;
            --accent-green: #10b981;
            --gold: #f59e0b;
            --text-light: #f8fafc;
            --text-muted: #94a3b8;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, sans-serif; }
        body { background-color: var(--bg-dark); color: var(--text-light); padding: 20px; }
        .container { max-width: 950px; margin: 0 auto; }

        header { text-align: center; margin-bottom: 25px; }
        header h1 { color: var(--gold); font-size: 2.2rem; margin-bottom: 5px; }
        header p { color: var(--text-muted); }

        /* Navigasyon */
        .step-nav { display: flex; gap: 8px; justify-content: center; margin-bottom: 25px; flex-wrap: wrap; }
        .step-btn { background: var(--card-bg); border: 1px solid #334155; color: white; padding: 10px 14px; border-radius: 8px; cursor: pointer; font-weight: bold; }
        .step-btn.active { background: var(--gold); color: black; border-color: var(--gold); }

        /* Kart Kutu */
        .lesson-card { background: var(--card-bg); border-radius: 12px; padding: 25px; display: none; box-shadow: 0 8px 16px rgba(0,0,0,0.4); }
        .lesson-card.active { display: block; }
        .lesson-card h2 { color: var(--gold); margin-bottom: 15px; }
        .lesson-card p { font-size: 1.05rem; line-height: 1.6; margin-bottom: 15px; color: #e2e8f0; }

        /* Poker Masası */
        .poker-table { background: var(--table-felt); border: 10px solid #5c3d2e; border-radius: 80px; padding: 25px; margin: 20px 0; text-align: center; box-shadow: inset 0 0 25px rgba(0,0,0,0.7); }
        .table-title { color: #86efac; font-size: 0.85rem; font-weight: bold; text-transform: uppercase; margin-bottom: 10px; letter-spacing: 1px; }

        .cards-row { display: flex; justify-content: center; gap: 8px; margin: 12px 0; flex-wrap: wrap; min-height: 80px; align-items: center; }
        
        /* Kart Tasarımı */
        .card { background: white; color: #1e293b; font-weight: bold; width: 52px; height: 78px; border-radius: 6px; display: flex; flex-direction: column; justify-content: center; align-items: center; font-size: 1.1rem; box-shadow: 0 4px 6px rgba(0,0,0,0.3); border: 1px solid #cbd5e1; }
        .card.red { color: #dc2626; }
        .card.back { background: #1e293b; border: 2px solid #38bdf8; color: #38bdf8; font-size: 1.4rem; }
        .card.empty { background: rgba(255,255,255,0.12); border: 2px dashed rgba(255,255,255,0.3); color: transparent; }

        /* Pratik Kutusu */
        .practice-box { background: rgba(0,0,0,0.3); border-left: 4px solid var(--accent-green); padding: 15px; border-radius: 6px; margin-top: 20px; }
        .practice-box h4 { color: var(--accent-green); margin-bottom: 8px; }
        .choice-btns { display: flex; gap: 10px; margin-top: 10px; flex-wrap: wrap; }
        .choice-btn { background: #3b82f6; border: none; color: white; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-weight: bold; }
        
        .result-msg { margin-top: 10px; font-weight: bold; padding: 8px; border-radius: 4px; display: none; }
        .result-msg.success { background: #166534; color: #86efac; display: block; }
        .result-msg.error { background: #991b1b; color: #fca5a5; display: block; }

        .nav-footer { display: flex; justify-content: space-between; margin-top: 25px; }
        .action-btn { background: var(--gold); border: none; color: black; font-weight: bold; padding: 10px 20px; border-radius: 6px; cursor: pointer; }
